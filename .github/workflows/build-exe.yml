name: Construir executáveis

# O PyInstaller não faz compilação cruzada: cada executável tem de ser
# construído no sistema a que se destina. Este fluxo produz os três.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artefacto: OrganizadorDeNotas-windows
            ficheiro: dist/OrganizadorDeNotas.exe
          - os: macos-latest
            artefacto: OrganizadorDeNotas-macos
            ficheiro: dist/OrganizadorDeNotas
          - os: ubuntu-latest
            artefacto: OrganizadorDeNotas-linux
            ficheiro: dist/OrganizadorDeNotas
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Correr os testes
        run: python -m pytest tests -q

      - name: Construir o executável
        run: python build_exe.py

      - name: Verificar que o executável arranca
        shell: bash
        run: |
          "${{ matrix.ficheiro }}" --port 8899 --no-browser &
          PID=$!
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS http://127.0.0.1:8899/ > /dev/null; then
              echo "O servidor respondeu."
              kill $PID || true
              exit 0
            fi
          done
          echo "O servidor não respondeu a tempo."
          kill $PID || true
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: ${{ matrix.ficheiro }}
          if-no-files-found: error
